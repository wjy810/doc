<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组件结构与接口：一个可访问的对话框</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 15px/1.6 system-ui, sans-serif; color: #1d2330; min-height: 420px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #c3c9d3; background: #fff; cursor: pointer; }
  button.primary { background: #2f6fdb; color: #fff; border-color: #2f6fdb; }
  button:focus-visible, input:focus-visible { outline: 3px solid #e4572e; outline-offset: 2px; }   /* 键盘焦点清晰可见 */
  dialog { border: 0; border-radius: 12px; padding: 20px 22px; width: min(420px, 90vw); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20, 24, 33, .45); }
  label { display: block; font-weight: 600; margin-top: 10px; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c3c9d3; border-radius: 6px; }
  input[aria-invalid="true"] { border-color: #b42318; }
  .hint { color: #5d6676; font-size: 13px; margin: 2px 0 0; }
  .error { color: #b42318; font-size: 13px; margin: 2px 0 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #result { margin-top: 12px; }
</style>
</head>
<body>
<button id="open" class="primary">重命名简历</button>
<p id="result" role="status"></p>

<!-- 原生 <dialog>：浏览器负责焦点限制在对话框内、Esc 关闭、背景不可操作 -->
<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
  <form method="dialog" id="form" novalidate>
    <h2 id="dlg-title" style="margin:0;font-size:18px">重命名简历</h2>
    <p id="dlg-desc" class="hint">新的名称会显示在简历列表与分析记录中。</p>
    <label for="name">简历名称</label>
    <input id="name" name="name" autocomplete="off" aria-describedby="name-hint name-error" required maxlength="30">
    <p id="name-hint" class="hint">最多 30 个字，例如“前端实习简历 2026 秋”。</p>
    <p id="name-error" class="error" hidden></p>
    <div class="actions">
      <button value="cancel" formnovalidate>取消</button>
      <button value="ok" class="primary" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
const dlg = document.getElementById('dlg');
const input = document.getElementById('name');
const error = document.getElementById('name-error');
let current = '前端实习简历';

document.getElementById('open').addEventListener('click', () => {
  input.value = current;            // 打开时填入当前值
  dlg.returnValue = '';             // 按 Esc 关闭时 returnValue 不会被改写，先清空上一次的结果
  showError('');
  dlg.showModal();                  // 焦点自动移到对话框中的第一个可聚焦元素
  input.select();
});

// 保存前校验：错误信息与输入框通过 aria-describedby 关联，读屏软件会一起读出
document.getElementById('save').addEventListener('click', e => {
  const v = input.value.trim();
  if (!v) { e.preventDefault(); showError('请填写简历名称。'); input.focus(); }
});

function showError(msg) {
  error.textContent = msg;
  error.hidden = !msg;
  input.setAttribute('aria-invalid', String(Boolean(msg)));
}

// 关闭后：根据按下的按钮决定结果；浏览器会把焦点还给打开对话框的按钮
dlg.addEventListener('close', () => {
  if (dlg.returnValue === 'ok') {
    current = input.value.trim();
    document.getElementById('result').textContent = `已重命名为“${current}”。`;
  }
});
</script>
</body>
</html>
