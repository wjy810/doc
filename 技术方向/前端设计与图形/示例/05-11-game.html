<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交互叙事与游戏化图形：接住简历</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 14px/1.5 system-ui, sans-serif; color: #222; }
  canvas { display: block; background: #fff; border: 1px solid #ddd; touch-action: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c" width="640" height="360" tabindex="0" aria-describedby="help"></canvas>
<p id="help">接住蓝色的“简历”得分，避开橙色的“错误”。方向键或指针移动托盘，空格开始、P 暂停。得到 10 分获胜，失去 3 条生命失败。</p>
<p class="sr-only" id="live" aria-live="polite"></p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// 可重现的随机数：同一关卡每次掉落顺序相同，方便测试与调整难度
function mulberry32(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// 状态机：每个状态决定画什么、接受什么输入
const State = { READY: 'ready', PLAYING: 'playing', PAUSED: 'paused', WON: 'won', LOST: 'lost' };
let state, score, lives, items, paddle, rand, spawnTimer, keys = {};

function reset() {
  rand = mulberry32(2026);
  score = 0; lives = 3; items = []; spawnTimer = 0;
  paddle = { x: 320, w: 96 };
  setState(State.READY);
}

function setState(s) {
  state = s;
  const messages = {
    ready: '准备：按空格或点击开始', playing: '进行中', paused: '已暂停：按 P 继续',
    won: `成功！得分 ${score}。按空格再玩一次`, lost: `失败，得分 ${score}。按空格重试`
  };
  document.getElementById('live').textContent = messages[s]; // 读屏软件会播报状态变化
}

function startOrRetry() {
  if (state === State.READY) setState(State.PLAYING);
  else if (state === State.WON || state === State.LOST) { reset(); setState(State.PLAYING); }
}

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startOrRetry(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === State.PLAYING) setState(State.PAUSED);
    else if (state === State.PAUSED) setState(State.PLAYING);
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('pointerdown', startOrRetry);
canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  paddle.x = e.clientX - r.left;
});
// 切到其他标签页时自动暂停
document.addEventListener('visibilitychange', () => { if (document.hidden && state === State.PLAYING) setState(State.PAUSED); });

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === State.PLAYING) update(dt);
  draw();
  requestAnimationFrame(frame);
}

function update(dt) {
  if (keys.ArrowLeft) paddle.x -= 420 * dt;
  if (keys.ArrowRight) paddle.x += 420 * dt;
  paddle.x = Math.max(paddle.w / 2, Math.min(640 - paddle.w / 2, paddle.x));

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    items.push({ x: 30 + rand() * 580, y: -10, good: rand() < 0.7, speed: 110 + rand() * 90 });
    spawnTimer = 0.7;
  }
  for (const it of items) it.y += it.speed * dt;
  // 碰撞：物体落到托盘高度，且水平位置在托盘范围内
  for (const it of items) {
    if (!it.done && it.y > 320 && it.y < 340 && Math.abs(it.x - paddle.x) < paddle.w / 2 + 8) {
      it.done = true;
      if (it.good) score++; else lives--;
    }
  }
  items = items.filter(it => !it.done && it.y < 380);
  if (score >= 10) setState(State.WON);
  if (lives <= 0) setState(State.LOST);
}

function draw() {
  ctx.clearRect(0, 0, 640, 360);
  for (const it of items) {
    ctx.fillStyle = it.good ? '#2f6fdb' : '#e4572e';
    if (it.good) { ctx.beginPath(); ctx.arc(it.x, it.y, 10, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(it.x - 9, it.y - 9, 18, 18);
  }
  ctx.fillStyle = '#333';
  ctx.fillRect(paddle.x - paddle.w / 2, 330, paddle.w, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';   // 信息栏的底色，保证文字不被物体遮住
  ctx.fillRect(0, 0, 640, 40);
  ctx.fillStyle = '#333';
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillText(`得分 ${score} / 10　　生命 ${'●'.repeat(lives)}${'○'.repeat(3 - lives)}`, 16, 26);
  if (state !== State.PLAYING) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(0, 120, 640, 90);
    ctx.fillStyle = '#222';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(document.getElementById('live').textContent, 320, 172);
    ctx.textAlign = 'start';
  }
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
