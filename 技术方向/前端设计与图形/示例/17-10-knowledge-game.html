<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对比度挑战：一个可以玩完的小型知识游戏</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/700.css">
<style>
  :root { --ink: #1d2330; --muted: #5b6475; --line: #dde1e7; --ok: #1f7a4d; --warn: #a15c00; --bad: #b3261e; --accent: #2f6fdb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f4f4f1; color: var(--ink); font: 13px/1.6 "Noto Sans SC", system-ui, sans-serif; }
  section.panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-width: 1140px; display: grid; gap: 8px; margin-bottom: 12px; }
  h2 { font-size: 14px; margin: 0; } h3 { font-size: 13px; margin: 4px 0 0; } .sub { color: var(--muted); margin: 0; font-size: 12px; } .m { font-size: 12px; margin: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 11.5px; } th, td { border-bottom: 1px solid var(--line); padding: 2px 5px; text-align: left; vertical-align: top; } th { color: var(--muted); font-weight: 400; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; } tr > th:first-child { white-space: nowrap; }
  .good { color: var(--ok); } .mid { color: var(--warn); } .poor { color: var(--bad); }
  .layout { display: grid; grid-template-columns: 470px minmax(0, 1fr); gap: 14px; align-items: start; }
  .game { border: 2px solid #2f6fdb; border-radius: 14px; padding: 14px 16px; min-height: 250px; display: grid; gap: 10px; align-content: start; background: #fcfdff; }
  .hud { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .hud .bar { flex: 1; height: 6px; background: #e6e9ef; border-radius: 3px; overflow: hidden; } .hud .bar i { display: block; height: 100%; background: #2f6fdb; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { border: 2px solid var(--line); border-radius: 10px; padding: 14px 10px; font-size: 15px; text-align: center; cursor: pointer; font-family: inherit; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt small { display: block; font-size: 11px; margin-top: 6px; opacity: 0.85; }
  .opt.right { border-color: #1f7a4d; } .opt.wrong { border-color: #b3261e; }
  button.big { font: inherit; font-size: 14px; padding: 6px 18px; border-radius: 8px; border: 0; background: #2f6fdb; color: #fff; cursor: pointer; }
  button.alt { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 8px; border: 1px solid #b9c3d3; background: #f3f6fb; cursor: pointer; }
  .fb { border-radius: 8px; padding: 8px 10px; font-size: 13px; } .fb.ok { background: #e3f1e8; } .fb.no { background: #fbe1de; }
  .hearts { letter-spacing: 2px; color: #b3261e; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid #c9d0db; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
  svg { width: 100%; height: auto; display: block; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: #fff3d6; color: #7a4a00; }
</style>
</head>
<body>
<section class="panel">
  <div class="layout">
    <div><div class="game" id="game" aria-live="polite"></div><p class="sub" style="margin-top:6px">截图停在测试脚本最后一局的一道题之后。按 <kbd>1</kbd> <kbd>2</kbd> 选择，<kbd>Enter</kbd> 继续。</p></div>
    <div style="display:grid;gap:8px">
      <h2>游戏的结构：开始、核心循环、失败与重试、结束</h2><svg id="flow" viewBox="0 0 620 195"></svg>
      <h2>测试脚本让四种“机器人玩家”各玩一遍</h2><p class="sub"><span class="tag">脚本操作</span> 机器人用真实的点击或按键操作游戏；它们只检查游戏能不能玩通、会不会卡住，不能代替真人测试“好不好玩”和“规则讲没讲明白”。</p>
      <table id="bots"></table><table id="checks"></table>
      <h2>真人测试时记录什么</h2><table id="obs"></table>
    </div>
  </div>
</section>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ok = (b, y = '✓', n = '✗') => b ? `<span class="good">${y}</span>` : `<span class="poor">${n}</span>`;
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ---------- 对比度（WCAG 相对亮度） ----------
const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
const lum = ([r, g, b]) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const hsl = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map(v => Math.round(v * 255)); };
const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
// 找一个与背景的对比度接近 target 的文字颜色：固定色相和饱和度，二分亮度
function colorFor(bg, target, h, s, dark) {
  let lo = dark ? 5 : 0, hi = dark ? 100 : 95, best = null;
  // 浅底：越暗对比越高；深底：越亮对比越高。对比度偏高就往背景的方向调
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2, c = hsl(h, s, m), r = contrast(c, bg); best = c; if (dark ? r < target : r > target) lo = m; else hi = m; }
  return best;
}
const LEVELS = [[7, 9, 2, 2.6], [6, 7.5, 2.6, 3.2], [5.5, 6.5, 3.2, 3.7], [5, 5.8, 3.6, 4.0], [4.7, 5.2, 3.9, 4.25], [4.55, 4.9, 4.1, 4.42]];
function makeQuestion(rnd, level) {
  const dark = rnd() < 0.3, bg = dark ? [24, 28, 38] : [255, 255, 255], [pa, pb, fa, fb] = LEVELS[level - 1];
  const h1 = Math.floor(rnd() * 360), h2 = (h1 + 90 + Math.floor(rnd() * 180)) % 360, s1 = 40 + Math.floor(rnd() * 45), s2 = 40 + Math.floor(rnd() * 45);
  const pass = colorFor(bg, pa + rnd() * (pb - pa), h1, s1, dark), fail = colorFor(bg, fa + rnd() * (fb - fa), h2, s2, dark);
  const passFirst = rnd() < 0.5, opts = passFirst ? [pass, fail] : [fail, pass];
  return { bg, dark, level, opts, ratios: opts.map(c => contrast(c, bg)), answer: passFirst ? 0 : 1 };
}

// ---------- 游戏状态 ----------
const RULE_CHECK = [
  { q: '正文要求的对比度至少是多少？', opts: ['3:1', '4.5:1'], answer: 1 },
  { q: '颜色越鲜艳，对比度就越高吗？', opts: ['是', '不一定，看亮度差'], answer: 1 }
];
const TOTAL = 12, LIVES = 3;
let G;
function newGame(seed) { G = { seed, rnd: mulberry32(seed), screen: 'start', lives: LIVES, n: 0, level: 1, correct: 0, streak: 0, best: 0, missed: [], reviewing: false, q: null, last: null, ck: 0, ckWrong: 0, visits: {}, log: [] }; render(); }
function nextQuestion() {
  if (!G.reviewing && G.n >= TOTAL) { if (G.missed.length) { G.reviewing = true; G.reviewQueue = [...G.missed]; } else return end('end'); }
  if (G.reviewing) { if (!G.reviewQueue.length) return end('end'); G.q = G.reviewQueue.shift(); }
  else G.q = makeQuestion(G.rnd, G.level);
  G.screen = 'q'; render();
}
function answer(i) {
  if (G.screen !== 'q') return;
  const right = i === G.q.answer;
  G.last = { i, right };
  if (!G.reviewing) { G.n++; if (right) { G.correct++; G.streak++; G.best = Math.max(G.best, G.streak); G.level = Math.min(6, G.level + 1); } else { G.streak = 0; G.lives--; G.level = Math.max(1, G.level - 1); G.missed.push(G.q); } }
  G.screen = 'fb'; render();
}
function cont() {
  if (G.screen === 'fb') { if (G.lives <= 0) return end('over'); return nextQuestion(); }
  if (G.screen === 'start') { G.screen = 'check'; G.ck = 0; return render(); }
  if (['end', 'over'].includes(G.screen)) return newGame(G.seed + 1);
}
function checkAnswer(i) {
  const c = RULE_CHECK[G.ck];
  if (i !== c.answer) { G.ckWrong++; G.screen = 'explain'; return render(); }
  G.ck++; if (G.ck >= RULE_CHECK.length) return nextQuestion(); render();
}
function end(kind) { G.screen = kind; render(); }
function render() {
  G.visits[G.screen] = (G.visits[G.screen] || 0) + 1; G.log.push(G.screen);
  const hud = `<div class="hud"><span>${G.reviewing ? '错题再练' : `第 ${Math.min(G.n + (G.screen === 'q' ? 1 : 0), TOTAL)}／${TOTAL} 题`}</span><span class="bar"><i style="width:${G.n / TOTAL * 100}%"></i></span><span class="hearts" aria-label="还有 ${G.lives} 次机会">${'♥'.repeat(Math.max(0, G.lives))}${'♡'.repeat(LIVES - Math.max(0, G.lives))}</span><span>难度 ${G.level}／6</span></div>`;
  const opt = (q, i, mark) => `<button type="button" class="opt ${mark || ''}" data-a="${i}" style="background:${hex(q.bg)};color:${hex(q.opts[i])}">${i + 1}．本周作业周五 18:00 截止${mark ? `<small>对比度 ${q.ratios[i].toFixed(2)}:1 ${q.ratios[i] >= 4.5 ? '达标' : '不达标'}</small>` : ''}</button>`;
  let h = '';
  if (G.screen === 'start') h = `<h2>对比度挑战</h2><p class="m"><b>目标</b>：12 道题里，每次从两行文字中选出<b>在正文字号下够清楚</b>的那一行——文字与背景的对比度至少 4.5:1（WCAG）。</p><p class="m"><b>规则</b>：选对了，下一题更难（两行越来越接近）；选错扣一颗心，共 3 颗。做完 12 题后，错过的题会再出现一次。</p><div class="opts">${(() => { const q = { bg: [255, 255, 255], opts: [[118, 118, 118], [170, 170, 170]], ratios: [contrast([118, 118, 118], [255, 255, 255]), contrast([170, 170, 170], [255, 255, 255])] }; return opt(q, 0, 'right') + opt(q, 1, 'wrong'); })()}</div><p class="sub">示例：左边 4.54:1 达标，右边 2.32:1 不达标。</p><button class="big" type="button" data-go>开始（先答两道规则小题）</button>`;
  else if (G.screen === 'check') { const c = RULE_CHECK[G.ck]; h = `<h2>规则小题 ${G.ck + 1}／2</h2><p class="m">${c.q}</p><div class="opts">${c.opts.map((o, i) => `<button type="button" class="opt" data-c="${i}" style="font-size:14px">${i + 1}．${o}</button>`).join('')}</div>`; }
  else if (G.screen === 'explain') h = `<h2>再看一眼规则</h2><p class="m">对比度只看<b>亮度</b>的差别：鲜艳的黄色在白底上可能只有 1.1:1，深灰却能到 7:1。正文要至少 4.5:1，大字（约 24 像素以上）至少 3:1。</p><button class="big" type="button" data-recheck>明白了，再答一次</button>`;
  else if (G.screen === 'q') h = hud + `<p class="m">哪一行在正文字号下够清楚？</p><div class="opts">${opt(G.q, 0)}${opt(G.q, 1)}</div>`;
  else if (G.screen === 'fb') { const r = G.last.right, q = G.q; h = hud + `<div class="fb ${r ? 'ok' : 'no'}"><b>${r ? '✓ 对了' : '✗ 不对'}</b>：${q.answer + 1} 号是 ${q.ratios[q.answer].toFixed(2)}:1，另一行 ${q.ratios[1 - q.answer].toFixed(2)}:1。${r ? (G.streak >= 3 ? `连续答对 ${G.streak} 题！` : '') : '颜色看起来更“醒目”不代表更清楚，要看亮度差。'}</div><div class="opts">${opt(q, 0, q.answer === 0 ? 'right' : 'wrong')}${opt(q, 1, q.answer === 1 ? 'right' : 'wrong')}</div><button class="big" type="button" data-go>${G.lives <= 0 ? '看看结果' : '下一题'}</button>`; }
  else if (G.screen === 'end' || G.screen === 'over') h = `<h2>${G.screen === 'end' ? '完成！' : '机会用完了'}</h2><p class="m">答对 ${G.correct}／${G.n} 题，最长连对 ${G.best} 题，最高难度 ${G.level}。${G.missed.length ? `错过的 ${G.missed.length} 题${G.screen === 'end' ? '已经重练过' : '下次会再出现'}。` : ''}</p><p class="m"><b>记住</b>：正文对比度至少 4.5:1；判断时看亮度差，不看颜色有多鲜艳；不确定就用工具算。</p><button class="big" type="button" data-go>再来一次</button>`;
  $('game').innerHTML = h;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !$('game').contains(t)) return;
  if (t.dataset.a != null) answer(Number(t.dataset.a)); else if (t.dataset.c != null) checkAnswer(Number(t.dataset.c)); else if (t.hasAttribute('data-recheck')) { G.screen = 'check'; render(); } else if (t.hasAttribute('data-go')) cont();
});
document.addEventListener('keydown', e => {
  if (e.key === '1' || e.key === '2') { const i = Number(e.key) - 1; if (G.screen === 'q') answer(i); else if (G.screen === 'check') checkAnswer(i); }
  else if (e.key === 'Enter' && ['start', 'fb', 'end', 'over'].includes(G.screen)) { e.preventDefault(); cont(); }
  else if (e.key === 'Enter' && G.screen === 'explain') { e.preventDefault(); G.screen = 'check'; render(); }
});

// ---------- 结构图 ----------
(() => {
  const N = { 开始: [52, 40, '规则＋示例'], 规则小题: [172, 40, '2 题'], 再讲一遍: [172, 140, '答错时'], 出题: [302, 40, '按难度'], 反馈: [432, 40, '为什么对／错'], 错题再练: [432, 140, '12 题后'], 结束: [562, 40, '小结'], 机会用完: [562, 140, '小结'] };
  let s = `<defs><marker id="f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b6475"/></marker></defs>`;
  const ln = (a, b, t, dy = 0, curve = 0) => { const [x1, y1] = N[a], [x2, y2] = N[b]; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + curve; s += `<path d="M${x1 + (x2 > x1 ? 42 : x2 < x1 ? -42 : 0)} ${y1 + (y2 > y1 ? 18 : y2 < y1 ? -18 : 0) + dy} Q${mx} ${my} ${x2 + (x2 > x1 ? -44 : x2 < x1 ? 44 : 0)} ${y2 + (y2 > y1 ? -18 : y2 < y1 ? 18 : 0) + dy}" fill="none" stroke="#9aa2b1" marker-end="url(#f)"/>${t ? `<text x="${mx}" y="${my - 4}" text-anchor="middle" font-size="10" fill="#5b6475" font-family="Noto Sans SC">${t}</text>` : ''}`; };
  ln('开始', '规则小题'); ln('规则小题', '出题', '都答对'); ln('规则小题', '再讲一遍', ''); ln('再讲一遍', '规则小题', '', 0, 0); ln('出题', '反馈'); ln('反馈', '出题', '下一题', 0, -40); ln('反馈', '错题再练', ''); ln('错题再练', '结束', ''); ln('反馈', '结束', ''); ln('反馈', '机会用完', '');
  s += `<path d="M562 158 Q310 210 52 58" fill="none" stroke="#9aa2b1" stroke-dasharray="4 3" marker-end="url(#f)"/><text x="310" y="192" text-anchor="middle" font-size="10" fill="#5b6475" font-family="Noto Sans SC">再来一次（新的题目）</text>`;
  for (const [n, [x, y, sub]] of Object.entries(N)) s += `<rect x="${x - 44}" y="${y - 18}" width="88" height="36" rx="10" fill="${['结束', '机会用完'].includes(n) ? '#e3f1e8' : n === '反馈' ? '#e8eefb' : '#fff'}" stroke="#9aa2b1"/><text x="${x}" y="${y - 2}" text-anchor="middle" font-size="12" font-weight="700" font-family="Noto Sans SC">${n}</text><text x="${x}" y="${y + 12}" text-anchor="middle" font-size="9.5" fill="#5b6475" font-family="Noto Sans SC">${sub}</text>`;
  s += `<text x="330" y="100" text-anchor="middle" font-size="10" fill="#2f6fdb" font-family="Noto Sans SC">核心循环：出题 → 选择 → 反馈（对了更难，错了扣心、变容易）；12 题后有错题就再练一遍</text>`;
  $('flow').innerHTML = s;
})();

$('obs').innerHTML = '<tr><th>观察项</th><th>怎么记</th><th>本页</th></tr>' + [
  ['能否用自己的话说出规则', '开始后 1 分钟，请玩家复述', '未填写'], ['第一次答错在哪一题、为什么', '记录题号与玩家的解释', '未填写'], ['是否看反馈里的数字', '观察视线或询问', '未填写'],
  ['难度感受（太易／合适／太难）', '每局结束问一次', '未填写'], ['是否主动再玩一局', '记录是否点“再来一次”', '未填写']
].map(r => `<tr><td>${r[0]}</td><td class="sub">${r[1]}</td><td class="mid">${r[2]}</td></tr>`).join('');
// 题目本身的检查：每道题恰好一行达标
const QCHECK = (() => { const r = mulberry32(99); let n = 0, bad = 0, minGap = 9; for (let lv = 1; lv <= 6; lv++) for (let i = 0; i < 200; i++) { const q = makeQuestion(r, lv); n++; const p = q.ratios.map(x => x >= 4.5); if (p[0] === p[1] || !p[q.answer]) bad++; if (lv === 6) minGap = Math.min(minGap, Math.abs(q.ratios[0] - q.ratios[1])); } return { n, bad, minGap }; })();
window.__kg = { newGame, G: () => G, QCHECK, contrast, report: (bots, checks) => {
  $('bots').innerHTML = '<tr><th>机器人</th><th>怎么玩</th><th>结果</th><th>经过的界面</th></tr>' + bots.map(b => `<tr><th>${b.name}</th><td class="sub">${b.how}</td><td>${b.result}</td><td class="sub">${b.screens}</td></tr>`).join('');
  $('checks').innerHTML = '<tr><th>检查</th><th>结果</th></tr>' + checks.map(c => `<tr><td>${c[0]}</td><td>${ok(c[1])} ${c[2]}</td></tr>`).join('');
} };
newGame(1);
</script>
</body>
</html>
