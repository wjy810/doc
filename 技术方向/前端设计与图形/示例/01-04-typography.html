<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体与排版工程：中英文混排、行高与断行</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; color: #1d2330;
         /* 字体栈：依次尝试，前面的字体不可用时使用后面的；最后的 sans-serif 是兜底 */
         font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 760px; margin-bottom: 12px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  figure { margin: 0; background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 12px 14px; }
  figcaption { font-size: 12px; color: #5d6676; margin-bottom: 6px; }
  p { margin: 0; font-size: 15px; }
  .tight { line-height: 1.3; }
  .comfort { line-height: 1.8; }
  h2 { font-size: 20px; line-height: 1.35; margin: 0; }
  .balance { text-wrap: balance; }      /* 让多行标题的每行长度更均衡 */
  .autospace { text-autospace: normal; } /* 较新的浏览器：自动在汉字与西文、数字之间加入较窄的间距 */
  .narrow { max-width: 10em; }
  .keep { word-break: keep-all; }        /* 汉字之间不再随意断开，只在空格与 <wbr> 处换行 */
</style>
</head>
<body>
<div class="grid three">
  <figure><figcaption>中英文之间没有空格</figcaption>
    <p class="comfort">使用React和TypeScript开发的简历分析功能，平均响应时间为3秒，支持PDF和Word格式。</p></figure>
  <figure><figcaption>没有空格，由 text-autospace 自动加间距</figcaption>
    <p class="comfort autospace">使用React和TypeScript开发的简历分析功能，平均响应时间为3秒，支持PDF和Word格式。</p></figure>
  <figure><figcaption>中英文、数字之间加空格</figcaption>
    <p class="comfort">使用 React 和 TypeScript 开发的简历分析功能，平均响应时间为 3 秒，支持 PDF 和 Word 格式。</p></figure>
</div>
<div class="grid">
  <figure><figcaption>行高 1.3：段落显得拥挤</figcaption>
    <p class="tight">简历分析会检查内容的完整性、表达的清晰程度与岗位要求的匹配程度，并给出具体的修改建议。每条建议都标明依据的原文位置，方便你逐条修改。</p></figure>
  <figure><figcaption>行高 1.8：适合中文正文阅读</figcaption>
    <p class="comfort">简历分析会检查内容的完整性、表达的清晰程度与岗位要求的匹配程度，并给出具体的修改建议。每条建议都标明依据的原文位置，方便你逐条修改。</p></figure>
</div>
<div class="grid three">
  <figure><figcaption>标题默认断行：可能断在词语中间</figcaption>
    <h2 class="narrow">怎样在简历中写清楚你的项目贡献</h2></figure>
  <figure><figcaption>text-wrap: balance：各行长度更均衡</figcaption>
    <h2 class="narrow balance">怎样在简历中写清楚你的项目贡献</h2></figure>
  <figure><figcaption>keep-all 加 &lt;wbr&gt;：只在指定的位置换行</figcaption>
    <h2 class="narrow balance keep">怎样在简历中<wbr>写清楚<wbr>你的项目贡献</h2></figure>
</div>
</body>
</html>
