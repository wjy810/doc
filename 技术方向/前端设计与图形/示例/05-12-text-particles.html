<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>综合项目：文字粒子画板</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 14px/1.5 system-ui, sans-serif; color: #222; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  .stage { width: 100%; max-width: 640px; height: 280px; }
  canvas { display: block; width: 100%; height: 100%; background: #111; border-radius: 6px; touch-action: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  input[type=text] { width: 9em; }
</style>
</head>
<body>
<div class="controls">
  <label>文字 <input id="text" type="text" value="创意编程" maxlength="20"></label>
  <label>密度 <input id="density" type="range" min="4" max="12" value="6"></label>
  <label>恢复速度 <input id="spring" type="range" min="1" max="20" value="8"></label>
  <label>颜色 <input id="color" type="color" value="#6ec3ff"></label>
  <label>种子 <input id="seed" type="number" value="7" style="width:5em"></label>
</div>
<div class="stage"><canvas id="c" aria-hidden="true"></canvas></div>
<p id="help">在画面上移动指针或手指，粒子会被推开，停止后回到文字的形状。密度数值越小，点越密。</p>
<p class="sr-only" id="live" aria-live="polite"></p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let W = 0, H = 0, particles = [], pointer = null, running = true;

function mulberry32(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// 第 1 步：文字 → 点。字号自动缩放，保证长文本也能放进画面
function textToPoints(text, step) {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d');
  let size = H * 0.6;
  o.font = `bold ${size}px system-ui, sans-serif`;
  const width = o.measureText(text).width;
  if (width > W * 0.9) size *= (W * 0.9) / width;
  o.font = `bold ${size}px system-ui, sans-serif`;
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  o.fillText(text, W / 2, H / 2);
  const data = o.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += step)
    for (let x = 0; x < W; x += step)
      if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x, y });
  return pts;
}

// 第 2 步：每个粒子记住自己的“家”（文字上的位置），从随机位置出发
function rebuild() {
  const text = $('text').value.trim();
  const rand = mulberry32(+$('seed').value || 1);
  const homes = text ? textToPoints(text, +$('density').value) : [];
  particles = homes.map(h => {
    const start = reduceMotion.matches ? h : { x: rand() * W, y: rand() * H };
    return { hx: h.x, hy: h.y, x: start.x, y: start.y, vx: 0, vy: 0 };
  });
  $('live').textContent = text ? `当前文字：${text}，共 ${particles.length} 个粒子` : '请输入文字';
}

// 第 3 步：画布尺寸跟随容器，并适配高清屏
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebuild();
}
new ResizeObserver(resize).observe(canvas);

// 第 4 步：输入（鼠标、触摸、触控笔都用指针事件）
canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
});
canvas.addEventListener('pointerleave', () => { pointer = null; });
['text', 'density', 'seed'].forEach(id => $(id).addEventListener('input', rebuild));

// 第 5 步：物理更新。弹簧把粒子拉回家，阻尼让它停下来，指针在一定半径内把粒子推开
const RADIUS = 70, PUSH = 1800, DAMPING = 6;
function update(dt) {
  const k = +$('spring').value * 4;
  for (const p of particles) {
    let ax = (p.hx - p.x) * k - p.vx * DAMPING;
    let ay = (p.hy - p.y) * k - p.vy * DAMPING;
    if (pointer && !reduceMotion.matches) {
      const dx = p.x - pointer.x, dy = p.y - pointer.y, d = Math.hypot(dx, dy);
      if (d < RADIUS && d > 0.01) {
        const f = (1 - d / RADIUS) * PUSH;
        ax += (dx / d) * f; ay += (dy / d) * f;
      }
    }
    p.vx += ax * dt; p.vy += ay * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);
  if (!particles.length) {
    ctx.fillStyle = '#888';
    ctx.font = '16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('请输入文字', W / 2, H / 2);
    ctx.textAlign = 'start';
    return;
  }
  ctx.fillStyle = $('color').value;
  const r = Math.max(1.2, +$('density').value * 0.35);
  for (const p of particles) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  }
}

// 第 6 步：动画循环。页面不可见时暂停，节省电量
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (running) { update(dt); draw(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { running = !document.hidden; last = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
