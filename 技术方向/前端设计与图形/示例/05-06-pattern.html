<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>算法图案：随机种子与噪声</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 14px/1.5 system-ui, sans-serif; color: #222; }
  .row { display: flex; gap: 12px; }
  figure { margin: 0; }
  canvas { display: block; background: #fff; border: 1px solid #ddd; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<p>同一组参数，只改变随机种子，就能得到不同但可以重现的结果。可以在地址后加 <code>?seed=123</code> 指定种子。</p>
<script>
// 可设定种子的伪随机数生成器（mulberry32）：同一个种子总是产生同一串数字
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 二维值噪声：在整数格点上放随机值，格点之间平滑插值，得到“连续变化的随机”
function makeNoise(rand) {
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const values = Array.from({ length: 256 }, () => rand());
  const at = (x, y) => values[perm[(perm[x & 255] + y) & 255]];
  const smooth = t => t * t * (3 - 2 * t);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; // 0—1 之间
  };
}

// 参数分成三类：结构、颜色、运动（本例是静态图，运动参数留作练习）
const params = {
  structure: { cell: 18, noiseScale: 0.012, length: 0.9 }, // 格子大小、噪声缩放、线段长度
  color: { palette: ['#2f6fdb', '#e4572e', '#f6c445', '#3a9d5d'], background: '#fffdf8' }
};

function draw(canvas, seed) {
  const rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const ctx = canvas.getContext('2d');
  const { cell, noiseScale, length } = params.structure;
  ctx.fillStyle = params.color.background;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  for (let y = cell / 2; y < canvas.height; y += cell) {
    for (let x = cell / 2; x < canvas.width; x += cell) {
      const n = noise(x * noiseScale, y * noiseScale);                      // 噪声决定方向
      const angle = n * Math.PI * 1.5;
      const color = params.color.palette[Math.floor(n * params.color.palette.length)];
      const half = (cell * length) / 2;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2 + rand() * 2;                                       // 随机扰动粗细
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(angle) * half, y - Math.sin(angle) * half);
      ctx.lineTo(x + Math.cos(angle) * half, y + Math.sin(angle) * half);
      ctx.stroke();
    }
  }
}

const fromUrl = Number(new URLSearchParams(location.search).get('seed'));
const seeds = fromUrl ? [fromUrl] : [7, 42];
for (const s of seeds) {
  const fig = document.createElement('figure');
  const c = document.createElement('canvas');
  c.width = 306; c.height = 306;
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', `随机种子 ${s} 生成的线条图案`);
  const cap = document.createElement('figcaption');
  cap.textContent = `随机种子 ${s}`;
  fig.append(c, cap);
  document.getElementById('row').appendChild(fig);
  draw(c, s);
}
</script>
</body>
</html>
