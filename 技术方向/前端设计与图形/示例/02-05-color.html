<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色彩系统：从色阶到颜色角色</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/400.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f4f4f1; color: #1d2330; font: 14px/1.6 Inter, "Noto Sans SC", system-ui, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 12px; }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .scale { display: grid; grid-template-columns: 70px repeat(10, 1fr); gap: 4px; align-items: center; margin-bottom: 4px; }
  .scale span { font-size: 12px; color: #616a7a; }
  .swatch { height: 34px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-variant-numeric: tabular-nums; }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 14px; }
  .theme { border-radius: 12px; padding: 14px 16px; border: 1px solid rgba(0,0,0,.08); }
  .theme h2 { font-size: 15px; margin: 0 0 8px; }
  .role { display: grid; grid-template-columns: 76px 1fr 86px; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }
  .chip { border-radius: 6px; padding: 3px 8px; font-size: 13px; }
  .ratio { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .ok::before { content: '✓ '; } .bad::before { content: '✕ '; }
</style>
</head>
<body>
<div class="controls">
  <label>品牌色相 <input type="range" id="hue" min="0" max="360" value="255"><output id="hueOut"></output></label>
  <label>彩度 <input type="range" id="chroma" min="0.02" max="0.2" step="0.01" value="0.13"><output id="chromaOut"></output></label>
</div>
<div id="scales"></div>
<div class="themes" id="themes"></div>
<script>
// ---------- OKLCH → sRGB：用于计算对比度（显示时直接交给浏览器的 oklch()） ----------
function oklchToLinearRgb(L, C, h) {
  const a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  const clamp = v => Math.min(1, Math.max(0, v));     // 超出显示范围的颜色简单截断（示意）
  return [clamp( 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
          clamp(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
          clamp(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
}
// 相对亮度直接用线性 RGB 计算；对比度 = (较亮 + 0.05) ÷ (较暗 + 0.05)
const luminance = ([r, g, b]) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
function contrast(c1, c2) {
  const [a, b] = [luminance(oklchToLinearRgb(...c1)), luminance(oklchToLinearRgb(...c2))].sort((x, y) => y - x);
  return (a + 0.05) / (b + 0.05);
}
const css = ([L, C, h]) => `oklch(${(L * 100).toFixed(1)}% ${C.toFixed(3)} ${h.toFixed(0)})`;

// ---------- 色阶：明度按固定步长变化，彩度在两端收小 ----------
const STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
const LIGHTNESS = [0.975, 0.94, 0.88, 0.80, 0.70, 0.60, 0.51, 0.42, 0.33, 0.24];
function ramp(h, c) {
  return LIGHTNESS.map((L, i) => [L, c * Math.sin(Math.PI * (0.12 + 0.76 * i / 9)), h]);
}
const STATUS = { 成功: 150, 警示: 70, 错误: 27 };

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.append(...children);
  return el;
}
function swatchRow(name, colors) {
  return h('div', { class: 'scale' }, h('span', {}, name), ...colors.map((c, i) => {
    const text = c[0] > 0.6 ? [0.2, 0.02, c[2]] : [0.99, 0.01, c[2]];
    return h('div', { class: 'swatch', style: `background:${css(c)};color:${css(text)}` }, String(STEPS[i]));
  }));
}

function render() {
  const hue = +document.getElementById('hue').value, chroma = +document.getElementById('chroma').value;
  document.getElementById('hueOut').textContent = hue;
  document.getElementById('chromaOut').textContent = chroma.toFixed(2);
  const brand = ramp(hue, chroma), neutral = ramp(hue, 0.012);
  const status = Object.fromEntries(Object.entries(STATUS).map(([k, sh]) => [k, ramp(sh, 0.14)]));
  document.getElementById('scales').replaceChildren(
    swatchRow('品牌色', brand), swatchRow('中性色', neutral),
    ...Object.entries(status).map(([k, r]) => swatchRow(k, r)));

  // ---------- 颜色角色：同一组角色，在两种主题中取色阶上不同的位置 ----------
  const themes = {
    浅色主题: { bg: neutral[0], surface: [1, 0, 0], text: neutral[9], muted: neutral[6], divider: neutral[2], border: neutral[5],
               primary: brand[6], onPrimary: [1, 0, 0], ...Object.fromEntries(Object.entries(status).map(([k, r]) => [k, r[7]])) },
    深色主题: { bg: [0.16, 0.012, hue], surface: neutral[9], text: neutral[0], muted: neutral[3], divider: neutral[7], border: neutral[5],
               primary: brand[3], onPrimary: brand[9], ...Object.fromEntries(Object.entries(status).map(([k, r]) => [k, r[3]])) }
  };
  const box = document.getElementById('themes');
  box.replaceChildren(...Object.entries(themes).map(([name, t]) => {
    // 每个角色都与它实际所在的背景配对检查：文字 4.5:1；输入框边框等识别所需的图形 3:1；装饰性分隔线不要求
    const rows = [
      ['正文', '这是一段正文', t.text, t.surface, 4.5],
      ['次要文字', '更新于 2 天前', t.muted, t.surface, 4.5],
      ['分隔线', '装饰，不要求', t.divider, t.surface, 0, true],
      ['控件边框', '输入框的边框', t.border, t.surface, 3, true],
      ['主操作', '投递简历', t.onPrimary, t.primary, 4.5, false, true],
      ['成功', '已保存', t.成功, t.surface, 4.5],
      ['警示', '还差 2 项', t.警示, t.surface, 4.5],
      ['错误', '上传失败', t.错误, t.surface, 4.5]
    ];
    return h('div', { class: 'theme', style: `background:${css(t.bg)};color:${css(t.text)}` },
      h('h2', {}, name),
      ...rows.map(([role, sample, fg, bg, need, isBorder, isButton]) => {
        const r = contrast(fg, bg), ok = r >= need;
        const verdict = `${r.toFixed(1)}:1`;
        const chip = isBorder
          ? h('span', { class: 'chip', style: `background:${css(bg)};border:2px solid ${css(fg)};color:${css(t.text)}` }, sample)
          : h('span', { class: 'chip', style: `background:${css(bg)};color:${css(fg)}${isButton ? ';font-weight:700' : ''}` }, sample);
        return h('div', { class: 'role' }, h('span', {}, role), chip,
          need ? h('span', { class: 'ratio ' + (ok ? 'ok' : 'bad'), style: `color:${ok ? css(t.成功) : css(t.错误)}` }, verdict)
               : h('span', { class: 'ratio', style: `color:${css(t.muted)}` }, verdict));
      }));
  }));
}
document.getElementById('hue').addEventListener('input', render);
document.getElementById('chroma').addEventListener('input', render);
render();
</script>
</body>
</html>
