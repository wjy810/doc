<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机与受控变化：种子、分布与参数范围</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.3.1/700.css">
<style>
  :root { --ink: #1d2330; --muted: #5b6475; --line: #dde1e7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f4f4f1; color: var(--ink); font: 13px/1.6 "Noto Sans SC", system-ui, sans-serif; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-width: 1100px; display: grid; gap: 8px; margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0; } .sub { color: var(--muted); margin: 0; }
  .dists { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .dists figure { margin: 0; display: grid; gap: 2px; }
  .dists canvas { width: 100%; height: auto; background: #f8fafc; border-radius: 6px; }
  .dists figcaption b { display: block; } .dists figcaption { font-size: 12px; color: var(--muted); }
  .posters { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  .posters figure { margin: 0; display: grid; gap: 2px; text-align: center; font-size: 11px; color: var(--muted); }
  .posters button { padding: 0; border: 0; background: none; cursor: zoom-in; }
  .posters canvas { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button.plain { font: inherit; padding: 2px 10px; border: 1px solid #c3c9d3; border-radius: 6px; background: #fff; cursor: pointer; }
  :focus-visible { outline: 3px solid #e4572e; outline-offset: 2px; }
  table { border-collapse: collapse; font-size: 12px; } th, td { border-bottom: 1px solid var(--line); padding: 3px 8px; text-align: left; } th { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<section>
  <h2>1 概率分布：同样是“随机”，形状完全不同</h2>
  <p class="sub">每种分布用同一个种子各取 10000 个数，画成直方图。分布决定了作品中“大多数”和“少数”各是什么样。</p>
  <div class="dists" id="dists"></div>
</section>
<section>
  <h2>2 系列海报：同一套规则，不同的种子</h2>
  <p class="sub">种子决定“这一张”具体长什么样，可以随时重现；风格的参数范围决定“这一系列”像什么。点击一张海报，地址栏会记下它的种子和风格。</p>
  <div class="bar">
    <label>风格 <select id="style"><option value="quiet">安静</option><option value="lively">热闹</option></select></label>
    <button type="button" class="plain" id="next">换一组种子</button>
    <span class="sub" id="picked" role="status"></span>
  </div>
  <div class="posters" id="posters"></div>
  <table id="ranges"></table>
</section>
<script>
// 可设定种子的伪随机数生成器（与《创意编程与二维图形》06 章相同）
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// 在均匀随机数的基础上做出其他分布
const dist = {
  uniform: r => r(),                                                       // 均匀：每个值的机会相同
  normal: r => { const u = 1 - r(), v = r(); return 0.5 + 0.15 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },   // 正态：集中在中间
  skewed: r => r() ** 3,                                                   // 偏斜：小值很多，大值很少
  weighted: (r, weights) => { let x = r() * weights.reduce((a, b) => a + b); for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; } return weights.length - 1; }   // 加权选择
};

// ---------- 1. 直方图 ----------
const DISTS = [
  ['uniform', '均匀分布', '大小平均分布：显得杂乱，没有主次'],
  ['normal', '正态分布', '多数接近中间值，极端值很少：自然、统一'],
  ['skewed', '偏斜分布', '很多小的、少数大的：有主次，像星空与城市'],
  ['weighted', '加权选择', '主色 60%、辅色 30%、强调色 10%：控制颜色比例']
];
const PALETTE = ['#2f4b7c', '#9db8e8', '#e4572e'];
for (const [key, name, note] of DISTS) {
  const fig = document.createElement('figure'), c = document.createElement('canvas'); c.width = 400; c.height = 220;
  fig.append(c); fig.insertAdjacentHTML('beforeend', `<figcaption><b>${name}</b>${note}</figcaption>`);
  document.getElementById('dists').append(fig);
  const g = c.getContext('2d'), r = mulberry32(7), bins = new Array(key === 'weighted' ? 3 : 20).fill(0);
  for (let i = 0; i < 10000; i++) {
    if (key === 'weighted') bins[dist.weighted(r, [6, 3, 1])]++;
    else { const v = Math.min(0.9999, Math.max(0, dist[key](r))); bins[Math.floor(v * bins.length)]++; }
  }
  const max = Math.max(...bins), bw = 380 / bins.length;
  bins.forEach((n, i) => {
    g.fillStyle = key === 'weighted' ? PALETTE[i] : '#2f6fdb';
    const h = n / max * 180;
    g.fillRect(10 + i * bw + 1, 200 - h, bw - 2, h);
  });
  g.fillStyle = '#5b6475'; g.font = '18px sans-serif'; g.fillText(key === 'weighted' ? `${bins.map(n => Math.round(n / 100) + '%').join(' · ')}` : '0', 10, 218);
  if (key !== 'weighted') g.fillText('1', 380, 218);
}

// ---------- 2. 系列海报 ----------
const STYLES = {
  quiet: { name: '安静', count: [8, 14], size: 'normal', palette: ['#2f4b7c', '#9db8e8', '#e8eef7', '#e4572e'], weights: [5, 4, 2, 0.4], bg: '#f6f3ec', lines: 0.06 },
  lively: { name: '热闹', count: [28, 46], size: 'skewed', palette: ['#e4572e', '#f3c98b', '#2f6fdb', '#1d2330'], weights: [4, 3, 2, 1], bg: '#fff8ee', lines: 0.12 }
};
function noise2(rand) {   // 简单的值噪声：先生成一张随机格子，再平滑插值
  const N = 8, grid = Array.from({ length: (N + 1) * (N + 1) }, rand);
  return (x, y) => { const xi = Math.floor(x) % N, yi = Math.floor(y) % N, fx = x - Math.floor(x), fy = y - Math.floor(y), s = t => t * t * (3 - 2 * t);
    const at = (i, j) => grid[(j % (N + 1)) * (N + 1) + (i % (N + 1))];
    const a = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * s(fx), b = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * s(fx);
    return a + (b - a) * s(fy); };
}
function poster(canvas, seed, styleKey) {
  const st = STYLES[styleKey], r = mulberry32(seed * 7919 + (styleKey === 'quiet' ? 1 : 2)), W = canvas.width, H = canvas.height, g = canvas.getContext('2d');
  g.fillStyle = st.bg; g.fillRect(0, 0, W, H);
  // 变化纹理：噪声决定短线的方向，每一张都不同，但质感一致
  const n = noise2(r);
  g.strokeStyle = `rgba(29, 35, 48, ${st.lines})`; g.lineWidth = 1.2;
  for (let y = 10; y < H; y += 12) for (let x = 10; x < W; x += 12) { const a = n(x / 60, y / 60) * Math.PI * 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 7, y + Math.sin(a) * 7); g.stroke(); }
  // 图形：数量、大小、颜色都来自风格规定的范围和分布
  const count = Math.round(st.count[0] + r() * (st.count[1] - st.count[0]));
  for (let i = 0; i < count; i++) {
    const s = Math.max(0.03, Math.min(1, dist[st.size](r))), size = 12 + s * (styleKey === 'quiet' ? 90 : 150);
    const x = 20 + r() * (W - 40), y = 20 + r() * (H * 0.7 - 20);
    g.fillStyle = st.palette[dist.weighted(r, st.weights)]; g.globalAlpha = 0.9;
    if (r() < 0.75) { g.beginPath(); g.arc(x, y, size / 2, 0, Math.PI * 2); g.fill(); }
    else { g.save(); g.translate(x, y); g.rotate(n(x / 80, y / 80) * Math.PI); g.fillRect(-size / 2, -size / 6, size, size / 3); g.restore(); }
  }
  g.globalAlpha = 1;
  // 可生成的视觉标志：三段圆弧，角度由种子决定；同一个活动的每张海报标志不同，但规则相同
  const cx = W - 52, cy = H - 58;
  g.lineWidth = 7; g.lineCap = 'round';
  for (let i = 0; i < 3; i++) { const a0 = r() * Math.PI * 2, len = 1.2 + r() * 2.4; g.strokeStyle = st.palette[i]; g.beginPath(); g.arc(cx, cy, 14 + i * 9, a0, a0 + len); g.stroke(); }
  g.fillStyle = '#1d2330'; g.font = '700 26px "Noto Sans SC", sans-serif'; g.fillText('生成艺术周', 20, H - 64);
  g.font = '400 14px "Noto Sans SC", sans-serif'; g.fillText(`2026 · 第 ${seed} 号`, 20, H - 40);
}
let base = 1;
function render() {
  const style = document.getElementById('style').value, box = document.getElementById('posters');
  box.replaceChildren();
  for (let i = 0; i < 8; i++) {
    const seed = base + i, fig = document.createElement('figure'), btn = document.createElement('button'), c = document.createElement('canvas');
    c.width = 300; c.height = 420; btn.type = 'button'; btn.setAttribute('aria-label', `查看第 ${seed} 号海报`); btn.append(c);
    poster(c, seed, style);
    btn.addEventListener('click', () => {
      history.replaceState(null, '', `?seed=${seed}&style=${style}`);
      document.getElementById('picked').textContent = `已记下：种子 ${seed}，风格“${STYLES[style].name}”。用这个地址打开，会得到完全相同的海报。`;
    });
    fig.append(btn, `种子 ${seed}`); box.append(fig);
  }
  const st = STYLES[style];
  document.getElementById('ranges').innerHTML = `<tr><th>参数</th><th>“${st.name}”的范围</th></tr>
    <tr><td>图形数量</td><td>${st.count[0]}—${st.count[1]} 个</td></tr><tr><td>大小分布</td><td>${st.size === 'normal' ? '正态：大小接近' : '偏斜：少数很大'}</td></tr>
    <tr><td>调色板与权重</td><td>${st.palette.map((c, i) => `<span style="display:inline-block;width:10px;height:10px;background:${c}"></span> ${Math.round(st.weights[i] / st.weights.reduce((a, b) => a + b) * 100)}%`).join('　')}</td></tr>
    <tr><td>纹理浓度</td><td>${st.lines}</td></tr>`;
}
document.getElementById('style').addEventListener('change', render);
document.getElementById('next').addEventListener('click', () => { base += 8; render(); });
const q = new URLSearchParams(location.search);
if (q.get('style') && STYLES[q.get('style')]) document.getElementById('style').value = q.get('style');
if (+q.get('seed')) base = +q.get('seed');
document.fonts.load('700 26px "Noto Sans SC"', '生成艺术周').finally(render);
// 测试用：同一个种子画两次，比较像素是否相同
window.__var = { same: (seed, style) => { const a = document.createElement('canvas'), b = document.createElement('canvas'); a.width = b.width = 300; a.height = b.height = 420; poster(a, seed, style); poster(b, seed, style); return a.toDataURL() === b.toDataURL(); } };
</script>
</body>
</html>
