<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源交付：加载进度、失败与降级</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 14px/1.5 system-ui, sans-serif; color: #222; }
  #stage { position: relative; width: 640px; height: 360px; border: 1px solid #ddd; background: #f2f3f5; }
  #stage canvas { display: block; }
  .overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  progress { width: 240px; }
  .fallback { background: #fff; border: 1px solid #ddd; padding: 12px 16px; max-width: 360px; text-align: left; }
</style>
</head>
<body>
<div id="stage">
  <div class="overlay" id="loading" role="status">
    <p>正在加载三维模型…</p>
    <progress id="bar" max="100" value="0"></progress>
  </div>
</div>
<p id="metrics"></p>
<p>提示：浏览器不允许本地文件页面直接读取模型文件。请在示例文件夹中运行 <code>python3 -m http.server 8000</code>，再打开 <code>http://localhost:8000/06-11-loading.html</code>。地址后加 <code>?fail=1</code> 可以演示加载失败。</p>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const t0 = performance.now();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(640, 360);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f2f3f5');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 640 / 360, 0.1, 100);
camera.position.set(4.6, 3.2, 6.2);
camera.lookAt(0, 1.3, 0);

// 加载管理器：统一跟踪进度、完成与失败
const manager = new THREE.LoadingManager();
let bytes = 0;
const url = new URLSearchParams(location.search).has('fail') ? 'models/missing.glb' : 'models/speaker.glb';
new GLTFLoader(manager).load(
  url,
  gltf => {
    scene.add(gltf.scene);
    document.getElementById('loading').remove();
    renderer.setAnimationLoop(() => {
      gltf.scene.rotation.y += 0.004;
      renderer.render(scene, camera);
    });
    requestAnimationFrame(() => {   // 第一帧画出之后，记录可交互的时间
      const ms = performance.now() - t0;
      const info = renderer.info.render;
      document.getElementById('metrics').textContent =
        `模型 ${(bytes / 1024).toFixed(0)} KB；加载到首次显示 ${ms.toFixed(0)} 毫秒；` +
        `每帧绘制调用 ${info.calls} 次，${info.triangles} 个三角形。`;
    });
  },
  e => {                              // 进度：已下载字节数 ÷ 总字节数
    bytes = e.loaded;
    if (e.total) document.getElementById('bar').value = (e.loaded / e.total) * 100;
  },
  () => {                             // 失败：给出可以阅读的替代内容，而不是一直转圈
    document.getElementById('loading').innerHTML = `
      <div class="fallback">
        <strong>三维模型暂时无法加载</strong>
        <p>智能音箱（示意）：高 2.5 单位，由底座、织物外壳、扬声器单元、顶盖与灯环组成。</p>
        <button onclick="location.href = location.pathname">重试</button>
      </div>`;
  }
);
</script>
</body>
</html>
