<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UV 纹理：二维图像怎样贴到三维表面</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  body { margin: 0; padding: 16px; background: #f7f7f5; font: 14px/1.5 system-ui, sans-serif; color: #222; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  #tex { border: 1px solid #ddd; }
  #stage { width: 412px; height: 256px; border: 1px solid #ddd; }
</style>
</head>
<body>
<div class="row">
  <figure style="margin:0"><canvas id="tex" width="256" height="256" role="img" aria-label="一张八乘八的棋盘格纹理，每格标有行列编号。"></canvas><figcaption>二维纹理（UV 空间）</figcaption></figure>
  <figure style="margin:0"><div id="stage" role="img" aria-label="同一张棋盘格纹理贴在立方体与球体上。球体两极附近格子被压缩。"></div><figcaption>贴到立方体与球体上</figcaption></figure>
</div>
<script type="module">
import * as THREE from 'three';

// 1. 用画布生成一张棋盘格纹理，每格写上编号，便于观察拉伸与接缝
const tex = document.getElementById('tex');
const c = tex.getContext('2d');
const N = 8, S = 256 / N;
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  c.fillStyle = (x + y) % 2 ? '#2f6fdb' : '#f6c445';
  c.fillRect(x * S, y * S, S, S);
  c.fillStyle = (x + y) % 2 ? '#fff' : '#333';
  c.font = '12px system-ui, sans-serif';
  c.fillText(`${y}${x}`, x * S + 9, y * S + 20);
}
const texture = new THREE.CanvasTexture(tex);
texture.colorSpace = THREE.SRGBColorSpace;   // 颜色纹理使用 sRGB 色彩空间
texture.anisotropy = 4;

// 2. 同一张纹理贴到两个物体上
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(412, 256);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffffff');
scene.add(new THREE.HemisphereLight('#ffffff', '#999999', 2.6));
const camera = new THREE.PerspectiveCamera(35, 412 / 256, 0.1, 100);
camera.position.set(0, 1.2, 6.2);
camera.lookAt(0, 0, 0);
const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
const box = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), material);
box.position.x = -1.3;
box.rotation.set(0.4, 0.6, 0);
const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), material);
ball.position.x = 1.3;
ball.rotation.x = 0.5;
scene.add(box, ball);
renderer.render(scene, camera);
</script>
</body>
</html>
